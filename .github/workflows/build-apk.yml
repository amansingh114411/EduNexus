name: Build EduNexus APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. NODE.JS
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =====================================================
      # 3. INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          npm install


      # =====================================================
      # 4. PREPARE WEB APP
      # =====================================================

      - name: Prepare web app
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp EduNexus_Updated.html www/index.html

          echo "Web application prepared."


      # =====================================================
      # 5. CREATE CAPACITOR CONFIG
      # =====================================================

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.edunexus.app",
            "appName": "EduNexus ERP",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          echo "Capacitor configuration created."


      # =====================================================
      # 6. ADD ANDROID PLATFORM
      # =====================================================

      - name: Add Android platform
        run: |
          npx cap add android


      # =====================================================
      # 7. COPY WEB APP TO ANDROID
      # =====================================================

      - name: Copy web app to Android
        run: |
          npx cap copy android


      # =====================================================
      # 8. CREATE CUSTOM EDUNEXUS LOGO
      # =====================================================

      - name: Create EduNexus custom logo
        run: |
          set -e

          echo "Creating EduNexus launcher logo..."

          sudo apt-get update
          sudo apt-get install -y imagemagick

          RES="android/app/src/main/res"

          mkdir -p "$RES/drawable"
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"
          mkdir -p "$RES/mipmap-anydpi-v26"


          # -------------------------------------------------
          # FULL EDUNEXUS LOGO
          # -------------------------------------------------

          cat > /tmp/edunexus-logo.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1024"
               height="1024"
               viewBox="0 0 1024 1024">

            <defs>
              <linearGradient id="bg"
                              x1="0"
                              y1="0"
                              x2="1"
                              y2="1">
                <stop offset="0%" stop-color="#4265F5"/>
                <stop offset="100%" stop-color="#233DA7"/>
              </linearGradient>
            </defs>

            <rect
              x="24"
              y="24"
              width="976"
              height="976"
              rx="220"
              fill="url(#bg)"
            />

            <!-- Graduation cap -->
            <polygon
              points="170,300 512,155 854,300 512,445"
              fill="#FFFFFF"
            />

            <rect
              x="345"
              y="300"
              width="334"
              height="88"
              rx="18"
              fill="#FFFFFF"
            />

            <path
              d="M680 340
                 C720 370 750 410 750 470
                 L700 490
                 L700 390
                 Z"
              fill="#FFFFFF"
            />

            <!-- EN -->
            <text
              x="512"
              y="735"
              text-anchor="middle"
              font-family="DejaVu Sans"
              font-size="330"
              font-weight="900"
              letter-spacing="-30"
              fill="#FFFFFF">EN</text>

          </svg>
          EOF


          # -------------------------------------------------
          # TRANSPARENT FOREGROUND
          # -------------------------------------------------

          cat > /tmp/edunexus-foreground.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1024"
               height="1024"
               viewBox="0 0 1024 1024">

            <!-- Graduation cap -->
            <polygon
              points="170,300 512,155 854,300 512,445"
              fill="#FFFFFF"
            />

            <rect
              x="345"
              y="300"
              width="334"
              height="88"
              rx="18"
              fill="#FFFFFF"
            />

            <path
              d="M680 340
                 C720 370 750 410 750 470
                 L700 490
                 L700 390
                 Z"
              fill="#FFFFFF"
            />

            <!-- EN -->
            <text
              x="512"
              y="735"
              text-anchor="middle"
              font-family="DejaVu Sans"
              font-size="330"
              font-weight="900"
              letter-spacing="-30"
              fill="#FFFFFF">EN</text>

          </svg>
          EOF


          # -------------------------------------------------
          # GENERATE LEGACY ICONS
          # -------------------------------------------------

          magick -background none \
            /tmp/edunexus-logo.svg \
            -resize 48x48! \
            "$RES/mipmap-mdpi/ic_launcher.png"

          magick -background none \
            /tmp/edunexus-logo.svg \
            -resize 72x72! \
            "$RES/mipmap-hdpi/ic_launcher.png"

          magick -background none \
            /tmp/edunexus-logo.svg \
            -resize 96x96! \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          magick -background none \
            /tmp/edunexus-logo.svg \
            -resize 144x144! \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          magick -background none \
            /tmp/edunexus-logo.svg \
            -resize 192x192! \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"


          # -------------------------------------------------
          # ROUND ICONS
          # -------------------------------------------------

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          # -------------------------------------------------
          # ADAPTIVE ICON FOREGROUND
          # -------------------------------------------------

          magick -background none \
            /tmp/edunexus-foreground.svg \
            -resize 1024x1024! \
            "$RES/drawable/ic_launcher_foreground.png"


          # -------------------------------------------------
          # ADAPTIVE ICON BACKGROUND
          # -------------------------------------------------

          cat > "$RES/drawable/ic_launcher_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">

              <gradient
                  android:angle="315"
                  android:startColor="#4265F5"
                  android:endColor="#233DA7" />

          </shape>
          EOF


          # -------------------------------------------------
          # ADAPTIVE ICON
          # -------------------------------------------------

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background" />

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground" />

          </adaptive-icon>
          EOF


          # -------------------------------------------------
          # ADAPTIVE ROUND ICON
          # -------------------------------------------------

          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@drawable/ic_launcher_background" />

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground" />

          </adaptive-icon>
          EOF


          echo "EduNexus custom logo created."


      # =====================================================
      # 9. SET ANDROID APP ICON + APP NAME
      # =====================================================

      - name: Configure Android branding
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@mipmap/ic_launcher"'
          )

          if 'android:roundIcon=' not in text:
              text = text.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@mipmap/ic_launcher" '
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          p.write_text(text)
          PY

          echo "Android branding configured."


      # =====================================================
      # 10. SETUP JAVA
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =====================================================
      # 11. RESTORE RELEASE SIGNING KEY
      # =====================================================

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

        run: |
          set -e

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode \
            > android/app/edunexus-release.jks

          test -s android/app/edunexus-release.jks

          echo "Release keystore restored successfully."


      # =====================================================
      # 12. VERIFY RELEASE SIGNING KEY
      # =====================================================

      - name: Verify release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

        run: |
          set -e

          keytool \
            -list \
            -keystore android/app/edunexus-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias edunexus

          echo "Release signing key verified."


      # =====================================================
      # 13. CONFIGURE ANDROID RELEASE SIGNING
      # =====================================================

      - name: Configure Android release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -e

          cat >> android/app/build.gradle <<'EOF'

          // =================================================
          // EduNexus Release Signing
          // =================================================

          android {

              signingConfigs {

                  release {

                      storeFile file("edunexus-release.jks")

                      storePassword System.getenv("KEYSTORE_PASSWORD")

                      keyAlias "edunexus"

                      keyPassword System.getenv("KEY_PASSWORD")

                  }

              }

              buildTypes {

                  release {

                      signingConfig signingConfigs.release

                      minifyEnabled false

                      shrinkResources false

                  }

              }

          }

          EOF

          echo "Android release signing configured."


      # =====================================================
      # 14. BUILD SIGNED RELEASE APK
      # =====================================================

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon

          cd ..

          echo "Release APK build completed."


      # =====================================================
      # 15. VERIFY APK EXISTS
      # =====================================================

      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"


      # =====================================================
      # 16. VERIFY APK SIGNATURE
      # =====================================================

      - name: Verify APK signature
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            -print \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android apksigner was not found."
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature verification passed."


      # =====================================================
      # 17. PREPARE FINAL APK
      # =====================================================

      - name: Prepare final APK
        run: |
          set -e

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/EduNexus-ERP-release.apk

          echo "Final APK prepared:"
          ls -lh release/EduNexus-ERP-release.apk


      # =====================================================
      # 18. UPLOAD APK ARTIFACT
      # =====================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: EduNexus-ERP-Release-APK
          path: release/EduNexus-ERP-release.apk


      # =====================================================
      # 19. CREATE GITHUB RELEASE
      # =====================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ github.run_number }}"
          name: "EduNexus ERP v${{ github.run_number }}"
          generate_release_notes: true
          files: release/EduNexus-ERP-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
