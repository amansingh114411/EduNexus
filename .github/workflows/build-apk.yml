name: Build EduNexus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # 2. NODE.JS
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =====================================================
      # 3. INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          npm install


      # =====================================================
      # 4. PREPARE WEB APP
      # =====================================================

      - name: Prepare web app
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp EduNexus_Updated.html www/index.html

          echo "Web application prepared."


      # =====================================================
      # 5. CREATE CAPACITOR CONFIG
      # =====================================================

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.edunexus.app",
            "appName": "EduNexus ERP",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          echo "Capacitor configuration created."


      # =====================================================
      # 6. ADD ANDROID
      # =====================================================

      - name: Add Android platform
        run: |
          npx cap add android


      # =====================================================
      # 7. COPY WEB APP
      # =====================================================

      - name: Copy web app to Android
        run: |
          npx cap copy android


      # =====================================================
      # 8. SETUP JAVA
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =====================================================
      # 9. RESTORE RELEASE SIGNING KEY
      # =====================================================

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/edunexus-release.jks

          test -s android/app/edunexus-release.jks

          echo "Release keystore restored successfully."


      # =====================================================
      # 10. VERIFY RELEASE KEY
      # =====================================================

      - name: Verify release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e

          keytool \
            -list \
            -keystore android/app/edunexus-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias edunexus

          echo "Release signing key verified."


      # =====================================================
      # 11. CONFIGURE ANDROID RELEASE SIGNING
      # =====================================================

      - name: Configure Android release signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // =================================================
          // EduNexus Release Signing
          // =================================================

          android {
              signingConfigs {
                  release {
                      storeFile file("edunexus-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "edunexus"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          EOF

          echo "Android release signing configured."


      # =====================================================
      # 12. BUILD SIGNED RELEASE APK
      # =====================================================

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon

          echo "Release APK build completed."


      # =====================================================
      # 13. VERIFY APK
      # =====================================================

      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"


      # =====================================================
      # 14. VERIFY APK SIGNATURE
      # =====================================================

      - name: Verify APK signature
        run: |
          set -e

          APK="android/app/build/outputs/apk/release/app-release.apk"

          apksigner verify --verbose "$APK"

          echo "APK signature verification passed."


      # =====================================================
      # 15. COPY FINAL APK
      # =====================================================

      - name: Prepare final APK
        run: |
          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/EduNexus-ERP-release.apk

          ls -lh release/EduNexus-ERP-release.apk


      # =====================================================
      # 16. UPLOAD RELEASE APK
      # =====================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: EduNexus-ERP-Release-APK
          path: release/EduNexus-ERP-release.apk
          retention-days: 30
