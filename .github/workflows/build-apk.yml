name: Build EduNexus APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v6


      # =========================================================
      # 2. NODE.JS
      # =========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false


      # =========================================================
      # 3. JAVA 21
      # =========================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'


      # =========================================================
      # 4. INSTALL CAPACITOR
      #
      # Fix:
      # npm ci failed earlier because package-lock.json
      # was not present.
      #
      # We deliberately use npm install here.
      # =========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install \
            --no-audit \
            --no-fund \
            --legacy-peer-deps \
            @capacitor/core@8.5.0 \
            @capacitor/cli@8.5.0 \
            @capacitor/android@8.5.0

          echo "=========================================="
          echo "Node:"
          node --version
          echo "npm:"
          npm --version
          echo "Capacitor:"
          npx cap --version
          echo "=========================================="


      # =========================================================
      # 5. PREPARE WEB APP
      # =========================================================

      - name: Prepare web app
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "EduNexus_Updated.html" ]; then
            echo "ERROR: EduNexus_Updated.html was not found."
            exit 1
          fi

          rm -rf www
          mkdir -p www

          cp EduNexus_Updated.html www/index.html

          echo "Web application prepared."
          ls -lh www/index.html


      # =========================================================
      # 6. CAPACITOR CONFIG
      # =========================================================

      - name: Create Capacitor config
        shell: bash
        run: |
          set -euo pipefail

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.edunexus.app",
            "appName": "EduNexus ERP",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          echo "Capacitor configuration:"
          cat capacitor.config.json


      # =========================================================
      # 7. CREATE CLEAN ANDROID PROJECT
      #
      # Every build gets a clean Android wrapper.
      # Your HTML/Firebase source is NOT deleted.
      # =========================================================

      - name: Add clean Android platform
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android

          npx cap add android

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper was not created."
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ERROR: Android app build.gradle was not created."
            exit 1
          fi

          echo "Android platform created successfully."


      # =========================================================
      # 8. CREATE CUSTOM EDUNEXUS LOGO
      #
      # IMPORTANT:
      # We DO NOT use the broken "magic" command.
      #
      # ImageMagick may expose either:
      #   magick
      # or
      #   convert
      #
      # This step supports both.
      # =========================================================

      - name: Create EduNexus custom logo
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing ImageMagick..."

          sudo apt-get update
          sudo apt-get install -y imagemagick

          if command -v magick >/dev/null 2>&1; then
            IM_BIN="magick"
          elif command -v convert >/dev/null 2>&1; then
            IM_BIN="convert"
          else
            echo "ERROR: ImageMagick command was not found."
            exit 1
          fi

          echo "Using ImageMagick command: $IM_BIN"

          "$IM_BIN" --version || true

          mkdir -p build-assets

          "$IM_BIN" \
            -size 1024x1024 \
            xc:none \
            -fill "#3159D9" \
            -draw "circle 512,512 512,30" \
            -fill white \
            -font DejaVu-Sans-Bold \
            -pointsize 250 \
            -gravity center \
            -annotate +0+12 "EN" \
            build-assets/edunexus-logo-1024.png

          if [ ! -s "build-assets/edunexus-logo-1024.png" ]; then
            echo "ERROR: EduNexus logo was not created."
            exit 1
          fi

          echo "Custom EduNexus logo created."

          identify build-assets/edunexus-logo-1024.png

          # =========================================================
      # NATIVE CAPACITOR SPLASH / ICON BRANDING
      # =========================================================

      - name: Generate native EduNexus splash and icons
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets

          cp \
            build-assets/edunexus-logo-1024.png \
            assets/logo.png

          echo "Installing Capacitor Assets..."

          npm install \
            --no-save \
            --no-audit \
            --no-fund \
            @capacitor/assets

          echo "Generating Android native branding..."

          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor "#3159D9" \
            --splashBackgroundColor "#FFFFFF"

          echo "Native EduNexus branding generated."

          find android/app/src/main/res \
            -maxdepth 2 \
            -type f \
            \( \
              -name "*splash*" \
              -o -name "ic_launcher*" \
            \) \
            -print \
            | sort

      # =========================================================
      # 9. CONFIGURE ANDROID APP ICON
      # =========================================================

      - name: Configure Android branding
        shell: bash
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          if command -v magick >/dev/null 2>&1; then
            IM_BIN="magick"
          elif command -v convert >/dev/null 2>&1; then
            IM_BIN="convert"
          else
            echo "ERROR: ImageMagick command not found."
            exit 1
          fi

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          # -----------------------------------------------------
          # MDPI
          # -----------------------------------------------------

          "$IM_BIN" \
            build-assets/edunexus-logo-1024.png \
            -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          cp \
            "$RES/mipmap-mdpi/ic_launcher.png" \
            "$RES/mipmap-mdpi/ic_launcher_round.png"


          # -----------------------------------------------------
          # HDPI
          # -----------------------------------------------------

          "$IM_BIN" \
            build-assets/edunexus-logo-1024.png \
            -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          cp \
            "$RES/mipmap-hdpi/ic_launcher.png" \
            "$RES/mipmap-hdpi/ic_launcher_round.png"


          # -----------------------------------------------------
          # XHDPI
          # -----------------------------------------------------

          "$IM_BIN" \
            build-assets/edunexus-logo-1024.png \
            -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          cp \
            "$RES/mipmap-xhdpi/ic_launcher.png" \
            "$RES/mipmap-xhdpi/ic_launcher_round.png"


          # -----------------------------------------------------
          # XXHDPI
          # -----------------------------------------------------

          "$IM_BIN" \
            build-assets/edunexus-logo-1024.png \
            -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          cp \
            "$RES/mipmap-xxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxhdpi/ic_launcher_round.png"


          # -----------------------------------------------------
          # XXXHDPI
          # -----------------------------------------------------

          "$IM_BIN" \
            build-assets/edunexus-logo-1024.png \
            -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp \
            "$RES/mipmap-xxxhdpi/ic_launcher.png" \
            "$RES/mipmap-xxxhdpi/ic_launcher_round.png"


          # -----------------------------------------------------
          # ADAPTIVE ICON
          # -----------------------------------------------------

          mkdir -p \
            "$RES/mipmap-anydpi-v26" \
            "$RES/drawable"

          cp \
            build-assets/edunexus-logo-1024.png \
            "$RES/drawable/edunexus_logo.png"


          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/edunexus_logo" />
              <foreground android:drawable="@drawable/edunexus_logo" />
          </adaptive-icon>
          EOF


          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/edunexus_logo" />
              <foreground android:drawable="@drawable/edunexus_logo" />
          </adaptive-icon>
          EOF


          echo "Android launcher branding configured."


      # =========================================================
      # 10. COPY WEB APP
      # =========================================================

      - name: Copy web app to Android
        shell: bash
        run: |
          set -euo pipefail

          npx cap copy android
          npx cap sync android

          echo "Web application copied into Android."


      # =========================================================
      # 11. RESTORE RELEASE KEYSTORE
      # =========================================================

      - name: Restore release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/edunexus-release.jks

          if [ ! -s "android/app/edunexus-release.jks" ]; then
            echo "ERROR: Release keystore could not be restored."
            exit 1
          fi

          echo "Release keystore restored successfully."


      # =========================================================
      # 12. VERIFY RELEASE KEY
      # =========================================================

      - name: Verify release signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          keytool \
            -list \
            -keystore android/app/edunexus-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias edunexus \
            >/dev/null

          echo "Release signing key verified successfully."


      # =========================================================
      # 13. CONFIGURE GRADLE RELEASE SIGNING
      # =========================================================

      - name: Configure Android release signing
        shell: bash
        run: |
          set -euo pipefail

          cat > android/edunexus-signing.gradle <<'EOF'
          android {

              signingConfigs {

                  release {

                      storeFile file("edunexus-release.jks")

                      storePassword System.getenv("KEYSTORE_PASSWORD")

                      keyAlias "edunexus"

                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {

                  release {

                      signingConfig signingConfigs.release

                      minifyEnabled false

                      shrinkResources false
                  }
              }
          }
          EOF


          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          text = path.read_text()

          marker = "// EDU_NEXUS_SIGNING_APPLY"

          hook = (
              "\n\n"
              + marker
              + "\n"
              + "apply from: rootProject.file('edunexus-signing.gradle')\n"
          )

          if marker not in text:
              path.write_text(text.rstrip() + hook)

          print("Android signing hook configured.")
          PY

          echo "Signing configuration:"
          cat android/edunexus-signing.gradle


      # =========================================================
      # 14. BUILD SIGNED RELEASE APK
      # =========================================================

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd android

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "=========================================="
          echo "SIGNED RELEASE APK CREATED"
          echo "=========================================="

          ls -lh app/build/outputs/apk/release/app-release.apk


      # =========================================================
      # 15. VERIFY APK EXISTS
      # =========================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is missing or empty."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"


      # =========================================================
      # 16. VERIFY APK SIGNATURE
      #
      # Fix:
      # Previous workflow searched incorrectly for apksigner.
      #
      # Android's official apksigner is used here.
      # =========================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          APKSIGNER=""

          if [ -n "${ANDROID_HOME:-}" ]; then

            APKSIGNER="$(
              find "$ANDROID_HOME/build-tools" \
                -type f \
                -name "apksigner" \
                -perm -111 \
                2>/dev/null \
                | sort -V \
                | tail -n 1
            )"

          fi


          if [ -z "$APKSIGNER" ]; then

            APKSIGNER="$(
              find /opt/hostedtoolcache \
                -type f \
                -name "apksigner" \
                -perm -111 \
                2>/dev/null \
                | sort -V \
                | tail -n 1
            )"

          fi


          if [ -z "$APKSIGNER" ]; then

            echo "ERROR: Android apksigner was not found."

            echo "ANDROID_HOME:"
            echo "${ANDROID_HOME:-NOT_SET}"

            echo "Searching Android SDK:"
            find "${ANDROID_HOME:-/opt/android-sdk}" \
              -type f \
              -name "apksigner*" \
              2>/dev/null \
              || true

            exit 1
          fi


          echo "Using apksigner:"
          echo "$APKSIGNER"


          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$APK"


          echo "=========================================="
          echo "APK SIGNATURE VERIFICATION PASSED"
          echo "=========================================="


      # =========================================================
      # 17. PREPARE FINAL APK
      # =========================================================

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release

          mkdir -p release

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            release/EduNexus-ERP-release.apk


          sha256sum \
            release/EduNexus-ERP-release.apk \
            | tee release/EduNexus-ERP-release.apk.sha256


          echo "Final release files:"
          ls -lh release/


      # =========================================================
      # 18. GITHUB ACTIONS ARTIFACT
      # =========================================================

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduNexus-ERP-Release
          path: |
            release/EduNexus-ERP-release.apk
            release/EduNexus-ERP-release.apk.sha256
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 19. PUBLIC GITHUB RELEASE
      #
      # No personal GitHub token is required here.
      #
      # github.token is the built-in Actions token.
      # =========================================================

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v1.0.${GITHUB_RUN_NUMBER}"


          gh release create "$TAG" \
            release/EduNexus-ERP-release.apk \
            release/EduNexus-ERP-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "EduNexus ERP $TAG" \
            --generate-notes


          echo ""
          echo "================================================"
          echo "       EDUNEXUS ERP RELEASE CREATED"
          echo "================================================"

          echo ""
          echo "Release page:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          echo ""
          echo "Latest release:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest"

          echo ""
          echo "DIRECT APK DOWNLOAD:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/EduNexus-ERP-release.apk"

          echo ""
          echo "================================================"
